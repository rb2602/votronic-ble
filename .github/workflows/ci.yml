# Runs on every push to main, on every pull request and weekly, because
# hassfest and HACS change their rules; for a pull request GitHub tests the
# merge result with the current main. The check jobs except
# hassfest and hacs also run locally, see docs/development.md. Actions are
# pinned to commits, the runner, Python and the tools to exact versions, and
# Renovate proposes upgrades as pull requests; what the pins do and do not
# fix is described in "Pinned tool versions" and "Dependency updates" in
# docs/development.md.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - run: python -m compileall -q custom_components tests
      - run: python -m unittest -v

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - run: pip install --quiet -r requirements-dev.txt
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      # Parses every YAML file and rejects duplicate keys; needs PyYAML, which
      # the test job does not install.
      - run: python -m unittest -v tests.test_config_files

  # Runs the integration inside Home Assistant, see "Home Assistant tests" in
  # docs/development.md: at the minimum version in hacs.json and at the
  # version requirements-ha-test.txt pins. The requirements of its Bluetooth
  # integration come from its manifests.
  ha-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        homeassistant: [minimum, current]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: |
            hacs.json
            requirements-ha-test.txt
      - name: Install Home Assistant
        env:
          HOMEASSISTANT: ${{ matrix.homeassistant }}
        run: |
          if [ "$HOMEASSISTANT" = minimum ]; then
            version=$(python -c 'import json; print(json.load(open("hacs.json"))["homeassistant"])')
            pip install --quiet "homeassistant==$version" pytest-homeassistant-custom-component
          else
            pip install --quiet -r requirements-ha-test.txt
          fi
      # The script prints several requirements, split into words on purpose.
      - run: |
          # shellcheck disable=SC2046
          pip install --quiet $(python tests/ha/integration_requirements.py)
      - run: python -m pytest

  # Scans the whole git history for leaked credentials, not only the pushed
  # commits, so a secret in an old commit fails the run too. The same tool
  # runs on staged changes before every commit, see .pre-commit-config.yaml.
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker://zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        # The container runs as root on a checkout owned by the runner user,
        # which git refuses without this exception.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
        with:
          args: git --no-banner --redact --verbose .

  hassfest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master

  # Validates the repository as HACS does, through the GitHub API; it needs
  # no checkout.
  hacs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          # A comment on the pull request would need write access.
          comment: "false"
