# Local checks before every commit. Install once per clone with
# `pre-commit install`, see docs/development.md. Versions match the pins
# used by CI so the hooks and CI cannot disagree; see "Pinned tool versions"
# in docs/development.md for how to upgrade them. Each hook is pinned to the
# commit of its tag, so a moved tag cannot change it; the tag is in the
# frozen comment.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
    hooks:
      - id: ruff-check
        files: ^(custom_components|tests)/
      - id: ruff-format
        files: ^(custom_components|tests)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
