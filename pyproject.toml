# Home Assistant tests in tests/ha, see "Home Assistant tests" in
# docs/development.md. The other tests use unittest.
[tool.pytest.ini_options]
testpaths = ["tests/ha"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.votronic_ble"]
# The shared helpers of tests/ha, imported by module name.
known-local-folder = ["helpers"]
